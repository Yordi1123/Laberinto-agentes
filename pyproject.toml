[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reto-laberinto-agentes"
version = "1.0.0"
description = "Comparación interactiva de agentes inteligentes en laberintos"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7,<4",
    "streamlit>=1.56,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
